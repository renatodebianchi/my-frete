name: my-frete

# Docker-first (Constitution §VIII): `docker compose up` brings the whole backend stack.
# The `api` image built here is the same artifact used in CI, staging and production.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: myfrete
      POSTGRES_USER: myfrete
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfrete}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfrete -d myfrete"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: my-frete/api:local
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=myfrete;Username=myfrete;Password=${POSTGRES_PASSWORD:-myfrete}"
      ConnectionStrings__Redis: "redis:6379"
      Otlp__Endpoint: "http://otel-collector:4317"
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ROUTE_PROVIDER_API_KEY: "${ROUTE_PROVIDER_API_KEY:-}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-dev-only-change-me-0123456789abcdef0123456789abcdef}"
      # Apply EF migrations on container start (Docker-first: no local `dotnet ef`).
      RunMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  redisdata:
