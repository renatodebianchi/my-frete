name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore MyFrete.sln
      - run: dotnet format MyFrete.sln --verify-no-changes
      - run: dotnet build MyFrete.sln -c Release --no-restore
      - name: Test (+ coverage)
        run: dotnet test MyFrete.sln -c Release --no-build --collect:"XPlat Code Coverage"
      - name: EF migrations drift
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/MyFrete.Migrations -s src/MyFrete.Api || true
      - name: Publish the /v1 API contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-v1
          path: specs/001-mini-freight-requests/contracts/openapi.yaml

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run codegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm test -- --ci

  image:
    name: API container image (build + scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          load: true
          tags: my-frete/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (Trivy) — blocking on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-frete/api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha

  contracts:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes @redocly/cli@1 lint specs/001-mini-freight-requests/contracts/openapi.yaml

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Vulnerable NuGet packages (production code)
        working-directory: api
        run: |
          dotnet restore MyFrete.sln
          # Gate on shipped code only. Test-only transitives (e.g. WireMock.Net -> Scriban)
          # are covered by the Trivy image scan, which gates the deployable artifact.
          for proj in src/MyFrete.Api src/MyFrete.BuildingBlocks src/MyFrete.Migrations src/Modules/*; do
            dotnet list "$proj" package --vulnerable --include-transitive 2>&1 | tee -a vuln.txt
          done
          ! grep -q "has the following vulnerable packages" vuln.txt
      - name: npm audit
        working-directory: mobile
        run: npm audit --audit-level=high || true
